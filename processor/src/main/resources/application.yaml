spring:
  application:
    name: processor
  datasource:
    url: jdbc:postgresql://localhost:5432/processor-service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:changelog/db.changelog-master.yaml
  elasticsearch:
    uris: //todo
    username: elastic
    password: elastic
  batch:
    jdbc:
      initialize-schema: never

app:
  directory:
    source-pattern: file:../parser/data/*.json
    output-directory: data/output
  batch:
    partition-concurrency-limit: 8
    retry-limit: 3

