spring:
  application:
    name: processor
  datasource:
    url: jdbc:postgresql://localhost:5432/processor
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:changelog/db.changelog-master.yaml
  elasticsearch:
    uris: http://localhost:9200
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

app:
  directory:
    source-pattern: file:processor/data/*.json
    output-directory: data/output
  batch:
    retry-limit: 3

